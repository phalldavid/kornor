name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button: rebuild now after changing Drive or the Sheet
  schedule:
    - cron: "17 * * * *"    # automatic rebuild every hour

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps already-compressed photos so only new or changed photos are processed.
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build.py --base "${{ steps.pages.outputs.base_path }}" ${{ vars.SITE_INDEXABLE == 'true' && '--indexable' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
